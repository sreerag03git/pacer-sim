# First-paint theme matches the light palette so there is no flash of the wrong
# colours before the injected CSS loads. The app's own toggle takes over at runtime.
[theme]
base = "light"
primaryColor = "#4C5EC4"
backgroundColor = "#E8EBEF"
secondaryBackgroundColor = "#E8EBEF"
textColor = "#272B33"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = false
