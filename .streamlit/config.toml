# First-paint theme matches the light palette so there is no flash of the wrong
# colours before the injected CSS loads. The app's own toggle takes over at runtime.
[theme]
base = "light"
primaryColor = "#EA4C89"
backgroundColor = "#F8F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0D0C22"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = false
