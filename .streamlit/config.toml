# First-paint theme matches the light palette so there is no flash of the wrong
# colours before the injected CSS loads. The app's own toggle takes over at runtime.
[theme]
base = "light"
primaryColor = "#3D5A80"
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#27272A"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = false
